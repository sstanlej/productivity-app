<div class="modal-backdrop" (click)="close()">
  <div class="modal-card ios-modal" (click)="$event.stopPropagation()">
    
    <!-- Nagłówek okna -->
    <div class="modal-header">
      <span class="modal-category">Nowe wydarzenie</span>
      <button class="btn-close-circle" type="button" (click)="close()" title="Zamknij">✕</button>
    </div>

    <form (ngSubmit)="submit()">
      <div class="modal-body">
        <h2 class="ios-title">Dodaj zadanie</h2>

        <!-- Grupa 1: Dane zadania -->
        <div class="ios-grouped-list">
          <div class="ios-cell-input">
            <label class="cell-label">Nazwa zadania</label>
            <input 
              type="text" 
              placeholder="np. Trening siłowy, Zrób zakupy..." 
              [(ngModel)]="title" 
              name="title" 
              required 
              class="ios-field-control"
              autofocus
            />
          </div>

          <div class="ios-cell-input">
            <label class="cell-label">Notatki (opcjonalnie)</label>
            <textarea 
              placeholder="Dodatkowe szczegóły..." 
              [(ngModel)]="description" 
              (input)="autoGrow($event)"
              name="description" 
              rows="2"
              class="ios-field-control textarea-field"
            ></textarea>
          </div>
        </div>

        <!-- Grupa 2: Planowanie w kalendarzu (Przełącznik iOS Toggle) -->
        <div class="ios-grouped-list">
          <div class="ios-toggle-cell">
            <div class="toggle-info">
              <span class="cell-title">Zaplanuj w kalendarzu</span>
              <span class="cell-subtitle">Wybierz datę i godzinę zadania</span>
            </div>
            
            <label class="ios-switch">
              <input type="checkbox" [(ngModel)]="isScheduled" name="isScheduled" />
              <span class="slider"></span>
            </label>
          </div>

          @if (isScheduled) {
            <div class="ios-schedule-fields">
              <div class="ios-cell-input">
                <label class="cell-label">Dzień</label>
                <input type="date" [(ngModel)]="date" name="date" class="ios-field-control" />
              </div>

              <div class="ios-time-grid">
                <div class="ios-cell-input">
                  <label class="cell-label">Początek</label>
                  <input type="time" [(ngModel)]="startTime" name="startTime" class="ios-field-control" />
                </div>
                <div class="ios-cell-input">
                  <label class="cell-label">Koniec</label>
                  <input type="time" [(ngModel)]="endTime" name="endTime" class="ios-field-control" />
                </div>
              </div>
            </div>
          }
        </div>
      </div>

      <!-- Stopka akcji -->
      <div class="modal-actions-space">
        <button type="button" class="btn-cancel-link" (click)="close()">
          Anuluj
        </button>
        <button type="submit" class="btn-submit-primary">
          {{ isScheduled ? 'Zapisz w kalendarzu' : 'Dodaj do Backlogu' }}
        </button>
      </div>
    </form>

  </div>
</div>
