<div class="app-layout">
  <header class="app-header">
    <h1>🚀 Productivity App</h1>
    <p>System zarządzania czasem i zadaniami</p>
  </header>

  <main class="dashboard-grid">
    <!-- Lewa kolumna: Formularz i Kalendarz -->
    <div class="main-column">
      <app-task-form (sessionCreated)="onSessionCreated()"></app-task-form>
      <app-calendar></app-calendar>
    </div>

    <!-- Prawa kolumna: Backlog zadań niezaplanowanych -->
    <div class="sidebar-column">
      <app-backlog (taskScheduled)="onTaskScheduled()"></app-backlog>
    </div>
  </main>
</div>
