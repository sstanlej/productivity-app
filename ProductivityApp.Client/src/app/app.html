<div class="app-layout">
  <header class="app-header">
    <h1>🚀 Productivity App</h1>
    <p>System zarządzania czasem i zadaniami</p>
  </header>

  <main class="dashboard-grid">
    <!-- Lewa kolumna: Tylko Kalendarz 3-dniowy -->
    <div class="main-column">
      <app-calendar></app-calendar>
    </div>

    <!-- Prawa kolumna: Backlog z wbudowanym formularzem dodawania -->
    <div class="sidebar-column">
      <app-backlog (taskScheduled)="onTaskScheduled()"></app-backlog>
    </div>
  </main>
</div>
